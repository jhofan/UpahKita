<style>
:root{--bg:#f6f3ee;--pn:#efebe3;--ln:#d9d3c7;--tx:#1f1b16;--mu:#6f675b;--ac:#c4452c;--sea:#ece8e0;--land:#e2dccf;--n:#0f7b55;--c:#5aa5c8;--k:#e5a237;--t:#b3291f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17150f;--pn:#211e17;--ln:#3a352a;--tx:#efeae0;--mu:#a49b8a;--sea:#1d1b15;--land:#2c291f;--ac:#e2664d;--n:#2fae80;--c:#6bb8da;--k:#eab04a;--t:#d9503f}}
:root[data-theme=dark]{--bg:#17150f;--pn:#211e17;--ln:#3a352a;--tx:#efeae0;--mu:#a49b8a;--sea:#1d1b15;--land:#2c291f;--ac:#e2664d;--n:#2fae80;--c:#6bb8da;--k:#eab04a;--t:#d9503f}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 'Instrument Sans',system-ui,sans-serif}
.serif{font-family:'Fraunces',Georgia,serif}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--ln);flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.logo{width:32px;height:32px;border-radius:8px;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:600}
.brand{font-family:Fraunces,serif;font-size:20px;font-weight:600}
.sub{color:var(--mu);font-size:13px}
header input[type=search]{flex:1;min-width:160px;max-width:420px;margin:0 auto;padding:8px 14px;border-radius:99px;border:1px solid var(--ln);background:var(--pn);color:var(--tx);font:inherit}
button{font:inherit;color:inherit;background:none;border:1px solid var(--ln);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{background:var(--pn)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.seg{display:flex;background:var(--pn);border-radius:10px;padding:3px;gap:2px}.seg button{flex:1;border:0;border-radius:8px;padding:7px 4px;font-size:14px}.seg button.on{background:var(--bg);box-shadow:0 0 0 1px var(--ln);font-weight:600}

(function(){

function hist(r){const H=window.UMK_HIST&&window.UMK_HIST[r.n];if(H&&H.length===5)return H.slice();
let h=0;for(const c of r.n)h=(h*31+c.charCodeAt(0))>>>0;
const rnd=k=>{const x=Math.sin(h*.001+k*12.9898)*43758.5453;return x-Math.floor(x)},g=[.07,.035,.065,.055];
